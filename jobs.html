<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quickmart – Job Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0f7c3f; --primary-dark: #0a5e2f; --primary-light: #e6f5ed;
            --accent: #d42e2e; --gold: #f5a623;
            --gray-50: #f8fafc; --gray-100: #f1f5f9; --gray-200: #e2e8f0;
            --gray-300: #cbd5e1; --gray-400: #94a3b8; --gray-500: #64748b;
            --gray-600: #475569; --gray-700: #334155; --gray-800: #1e293b; --gray-900: #0f172a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12); --shadow-xl: 0 20px 60px rgba(0,0,0,0.15);
            --radius: 12px; --radius-lg: 20px; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; outline: none; }
        input { font-family: inherit; outline: none; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== LOADING OVERLAY ===== */
        #loadingOverlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            transition: opacity 0.5s ease;
            text-align: center;
            padding: 2rem;
        }
        #loadingOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .spinner {
            width: 4rem;
            height: 4rem;
            border: 5px solid var(--gray-200);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        #loadingText {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--gray-700);
            letter-spacing: 0.5px;
            min-height: 2.5rem;
            transition: opacity 0.3s ease;
        }
        #loadingSubtext {
            font-size: 0.9rem;
            color: var(--gray-500);
            min-height: 1.5rem;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(226,232,240,0.6);
            padding: 0 2rem; height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }
        .nav-brand {
            display: flex; align-items: center; gap: 10px;
            font-weight: 800; font-size: 1.35rem; color: var(--primary);
        }
        .nav-brand i { font-size: 1.6rem; color: var(--accent); }
        .nav-brand span { color: var(--gray-900); }
        .nav-links {
            display: flex; align-items: center; gap: 0.5rem;
        }
        .nav-links a {
            padding: 0.5rem 1.2rem; border-radius: 50px;
            font-weight: 600; font-size: 0.85rem;
            color: var(--gray-600); transition: var(--transition);
        }
        .nav-links a:hover { background: var(--gray-100); color: var(--gray-900); }
        .nav-links a.active { background: var(--primary); color: #fff; }
        .nav-cta {
            background: var(--primary) !important; color: #fff !important;
            padding: 0.5rem 1.5rem !important; border-radius: 50px !important;
            font-weight: 700 !important;
        }
        .nav-cta:hover { background: var(--primary-dark) !important; transform: scale(1.02); }

        /* ===== JOBS PAGE ===== */
        #page-jobs {
            padding: 100px 2rem 4rem;
            max-width: 1280px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }
        .jobs-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .jobs-header h2 {
            font-size: 2rem;
            font-weight: 800;
            color: var(--gray-900);
        }
        .jobs-header p {
            color: var(--gray-500);
            max-width: 560px;
            margin: 0.3rem auto 0;
        }
        .jobs-filters {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2.5rem;
        }
        .jobs-filters button {
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--gray-100);
            color: var(--gray-600);
            transition: var(--transition);
        }
        .jobs-filters button.active {
            background: var(--primary);
            color: #fff;
        }
        .jobs-filters button:hover:not(.active) {
            background: var(--gray-200);
        }
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        .job-card {
            background: #fff;
            border-radius: var(--radius-lg);
            padding: 1.8rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-200);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }
        .job-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: var(--gray-300);
        }
        .job-card .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.6rem;
        }
        .job-card .job-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gray-900);
        }
        .job-card .job-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            flex-shrink: 0;
            margin-top: 0.2rem;
        }
        .job-card .job-badge.available {
            background: #dcfce7;
            color: #166534;
        }
        .job-card .job-badge.unavailable {
            background: #fef2f2;
            color: #991b1b;
        }
        .job-card .job-tasks {
            margin: 0.6rem 0 1rem;
            padding-left: 1.2rem;
            font-size: 0.85rem;
            color: var(--gray-600);
            line-height: 1.7;
            flex: 1;
        }
        .job-card .job-tasks li {
            list-style: disc;
        }
        .job-card .job-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--gray-100);
            flex-wrap: wrap;
            gap: 0.6rem;
        }
        .job-card .job-salary {
            font-weight: 700;
            color: var(--primary-dark);
            font-size: 0.95rem;
        }
        .job-card .job-salary .unavailable-text {
            color: var(--gray-400);
            font-weight: 400;
            font-size: 0.8rem;
        }
        .job-card .job-fee {
            font-size: 0.75rem;
            color: var(--gray-500);
            background: var(--gray-100);
            padding: 0.2rem 0.8rem;
            border-radius: 50px;
        }
        .btn-apply {
            padding: 0.5rem 1.4rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.8rem;
            background: var(--primary);
            color: #fff;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-apply:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
        }
        .btn-apply:disabled {
            background: var(--gray-300);
            cursor: not-allowed;
            transform: none;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 10000;
            background: var(--gray-900);
            color: #fff;
            padding: 0.8rem 1.6rem;
            border-radius: var(--radius);
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #166534; }
        .toast.error { background: #991b1b; }

        @media (max-width: 900px) {
            .jobs-grid { grid-template-columns: 1fr; }
            .navbar { padding: 0 1rem; }
            #page-jobs { padding: 90px 1rem 3rem; }
            .nav-links a { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
        }
        @media (max-width: 480px) {
            .jobs-header h2 { font-size: 1.5rem; }
            .job-card .job-footer { flex-direction: column; align-items: stretch; }
            .job-card .btn-apply { justify-content: center; }
            #loadingText { font-size: 1rem; }
            #loadingSubtext { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div id="loadingText">Analysing your details...</div>
        <div id="loadingSubtext">Please wait while we verify your information</div>
    </div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar" id="navbar">
        <div class="nav-brand">
            <i class="fas fa-store"></i> Quick<span>mart</span>
        </div>
        <div class="nav-links">
            <a href="landing.html"><i class="fas fa-home"></i> Home</a>
            <a href="details.html"><i class="fas fa-user-edit"></i> Details</a>
            <a href="jobs.html" class="active"><i class="fas fa-briefcase"></i> Jobs</a>
            <a href="details.html" class="nav-cta"><i class="fas fa-paper-plane"></i> Apply Now</a>
        </div>
    </nav>

    <!-- ===== JOBS SECTION ===== -->
    <section id="page-jobs" style="display:none;">
        <div class="jobs-header">
            <h2><i class="fas fa-briefcase" style="color:var(--primary);margin-right:10px;"></i>Available Positions</h2>
            <p>Browse through our open roles. Click <strong>Apply</strong> to proceed to the payment page.</p>
        </div>

        <div class="jobs-filters">
            <button class="active" data-filter="all">All</button>
            <button data-filter="available">Available</button>
            <button data-filter="unavailable">Unavailable</button>
        </div>

        <div class="jobs-grid" id="jobsGrid"></div>
    </section>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <script>
        (function() {
            // ================================================================
            // LOADING SEQUENCE (6 seconds with changing text)
            // ================================================================
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const loadingSubtext = document.getElementById('loadingSubtext');

            const steps = [
                { text: 'Analysing your details...', sub: 'Checking personal information' },
                { text: 'Verifying qualifications...', sub: 'Cross-referencing with our database' },
                { text: 'Matching you with available roles...', sub: 'Finding the best fit for you' },
                { text: 'Finalising job recommendations...', sub: 'Almost there!' }
            ];

            let stepIndex = 0;
            const interval = 1500; // 1.5 seconds per step – total 6 seconds (4 steps)

            const stepInterval = setInterval(() => {
                stepIndex++;
                if (stepIndex < steps.length) {
                    loadingText.textContent = steps[stepIndex].text;
                    loadingSubtext.textContent = steps[stepIndex].sub;
                } else {
                    clearInterval(stepInterval);
                    // Hide overlay and show jobs
                    overlay.classList.add('hidden');
                    setTimeout(() => overlay.remove(), 500);
                    document.getElementById('page-jobs').style.display = 'block';
                    // Render jobs after overlay is gone
                    renderJobs('all');
                }
            }, interval);

            // ================================================================
            // JOBS DATA & RENDER
            // ================================================================
            const JOBS = [
                { id: 1, title: 'Store Manager', available: true, salary: 'KES 150,000', fee: 2500, tasks: ['Oversee daily store operations and staff management','Ensure customer satisfaction and resolve complaints','Manage inventory, budgets, and financial reporting','Implement company policies and safety standards','Drive sales growth and promotional activities'] },
                { id: 2, title: 'Assistant Store Manager', available: true, salary: 'KES 100,000', fee: 2000, tasks: ['Support the Store Manager in daily operations','Supervise department heads and staff scheduling','Monitor inventory levels and place orders','Assist in staff training and performance reviews','Handle customer escalations and store compliance'] },
                { id: 3, title: 'Department Supervisor', available: true, salary: 'KES 70,000', fee: 1500, tasks: ['Supervise a specific department (e.g., Grocery, Fresh Produce)','Ensure department targets and standards are met','Manage staff rotas and training within the department','Monitor product quality, pricing, and displays','Report on departmental performance'] },
                { id: 4, title: 'Cashier', available: true, salary: 'KES 45,000', fee: 500, tasks: ['Process customer transactions accurately and efficiently','Handle cash, card, and mobile payments','Maintain a clean and organized checkout area','Assist customers with bagging and queries','Balance cash drawer at the start and end of shift'] },
                { id: 5, title: 'Sales Associate', available: true, salary: 'KES 40,000', fee: 400, tasks: ['Assist customers with product selection and inquiries','Maintain shelf stock and product displays','Monitor inventory and report low-stock items','Process returns and exchanges with care','Participate in store promotions and events'] },
                { id: 6, title: 'Stock Clerk', available: true, salary: 'KES 38,000', fee: 350, tasks: ['Receive and verify incoming shipments','Organize and maintain stockroom inventory','Label and rotate stock according to FIFO principles','Assist in periodic inventory counts','Keep storage areas clean and safe'] },
                { id: 7, title: 'Customer Service Representative', available: true, salary: 'KES 42,000', fee: 400, tasks: ['Provide exceptional service at the customer service desk','Handle customer complaints and resolve issues','Process returns, exchanges, and refunds','Assist with loyalty program inquiries','Maintain a welcoming and helpful attitude'] },
                { id: 8, title: 'Bakery Associate', available: true, salary: 'KES 40,000', fee: 400, tasks: ['Prepare and bake fresh bread, pastries, and cakes','Follow recipes and food safety guidelines','Display baked goods attractively','Monitor inventory of baking ingredients','Maintain cleanliness of baking equipment and area'] },
                { id: 9, title: 'Deli Associate', available: true, salary: 'KES 40,000', fee: 400, tasks: ['Slice and prepare meats, cheeses, and salads','Maintain deli counter cleanliness and food safety','Assist customers with orders and recommendations','Monitor inventory and rotate stock','Operate slicing and preparation equipment'] },
                { id: 10, title: 'Meat Cutter', available: true, salary: 'KES 45,000', fee: 450, tasks: ['Cut, trim, and prepare meat products to customer specifications','Maintain meat display cases and ensure freshness','Follow food safety and hygiene standards','Manage inventory and minimize waste','Assist customers with meat selection and cooking tips'] },
                { id: 11, title: 'Produce Associate', available: true, salary: 'KES 38,000', fee: 350, tasks: ['Stock and rotate fresh fruits and vegetables','Maintain produce displays and ensure quality','Remove damaged or expired products','Assist customers with product selection','Keep produce area clean and organized'] },
                { id: 12, title: 'Receiving Clerk', available: true, salary: 'KES 40,000', fee: 400, tasks: ['Inspect and verify incoming deliveries against purchase orders','Record receipt of goods and update inventory systems','Coordinate with departments to distribute stock','Handle returns and discrepancies with suppliers','Maintain accurate receiving logs'] },
                { id: 13, title: 'Security Guard', available: true, salary: 'KES 35,000', fee: 350, tasks: ['Monitor store premises and ensure safety of customers and staff','Prevent theft and respond to security incidents','Conduct regular patrols of the store and parking area','Check CCTV footage and maintain security logs','Assist in emergency procedures and crowd control'] },
                { id: 14, title: 'Cleaner', available: true, salary: 'KES 30,000', fee: 300, tasks: ['Clean and maintain store floors, aisles, and restrooms','Dispose of waste and ensure proper recycling','Restock cleaning supplies and equipment','Report maintenance issues to management','Maintain a high standard of cleanliness and hygiene'] },
                { id: 15, title: 'IT Support', available: true, salary: 'KES 60,000', fee: 1200, tasks: ['Provide technical support for POS systems and store hardware','Troubleshoot network and software issues','Maintain and update computer systems and peripherals','Assist staff with technology-related queries','Ensure data security and backup procedures'] },
                { id: 16, title: 'Marketing Coordinator', available: true, salary: 'KES 65,000', fee: 1500, tasks: ['Plan and execute in-store marketing campaigns','Manage social media and digital presence','Coordinate with vendors and suppliers on promotions','Analyze market trends and customer feedback','Create engaging content for store communications'] },
                { id: 17, title: 'HR Assistant', available: true, salary: 'KES 55,000', fee: 1000, tasks: ['Assist with recruitment, onboarding, and training processes','Maintain employee records and HR documentation','Support payroll and benefits administration','Coordinate staff events and wellness initiatives','Respond to employee inquiries and policy questions'] },
                { id: 18, title: 'Accountant', available: true, salary: 'KES 70,000', fee: 1500, tasks: ['Manage financial records, ledgers, and reconciliations','Prepare monthly financial reports and budgets','Oversee accounts payable and receivable','Ensure tax compliance and statutory deductions','Analyze financial data to support business decisions'] },
                { id: 19, title: 'Regional Manager', available: false, salary: null, fee: 0, tasks: ['Oversee multiple store operations in a region','Drive sales performance and operational excellence','Develop and implement regional strategies','Manage regional budgets and financial targets','Lead and mentor store management teams'] },
                { id: 20, title: 'Supply Chain Director', available: false, salary: null, fee: 0, tasks: ['Lead the supply chain and logistics strategy','Manage supplier relationships and procurement','Optimize inventory levels and distribution networks','Ensure cost efficiency and on-time deliveries','Develop contingency plans for supply chain disruptions'] },
                { id: 21, title: 'Marketing Director', available: false, salary: null, fee: 0, tasks: ['Develop and execute the overall marketing strategy','Drive brand awareness and customer engagement','Manage marketing budgets and campaign ROI','Lead the marketing team and external agencies','Analyze market trends and consumer insights'] },
                { id: 22, title: 'Store Director', available: false, salary: null, fee: 0, tasks: ['Provide strategic leadership for the store portfolio','Drive operational efficiency and customer satisfaction','Develop and implement long-term store strategies','Mentor and develop senior store leadership','Ensure compliance with corporate policies and standards'] }
            ];

            // ================================================================
            // RENDER FUNCTIONS
            // ================================================================
            const jobsGrid = document.getElementById('jobsGrid');
            const filterBtns = document.querySelectorAll('.jobs-filters button');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            let currentFilter = 'all';

            function showToast(message, type = 'success') {
                toastMessage.textContent = message;
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                if (type === 'error') toast.classList.add('error');
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 4000);
            }

            function getSortedJobs() {
                const available = JOBS.filter(j => j.available).sort((a,b) => a.fee - b.fee);
                const unavailable = JOBS.filter(j => !j.available);
                const result = [];
                let availIdx = 0, unavailIdx = 0;
                while (availIdx < available.length) {
                    for (let i=0; i<3 && availIdx<available.length; i++) result.push(available[availIdx++]);
                    if (unavailIdx < unavailable.length) result.push(unavailable[unavailIdx++]);
                }
                while (unavailIdx < unavailable.length) result.push(unavailable[unavailIdx++]);
                return result;
            }

            function renderJobs(filter = 'all') {
                const sorted = getSortedJobs();
                const filtered = sorted.filter(job => {
                    if (filter === 'available') return job.available;
                    if (filter === 'unavailable') return !job.available;
                    return true;
                });
                if (filtered.length === 0) {
                    jobsGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:3rem;color:var(--gray-500);"><i class="fas fa-search" style="font-size:2rem;display:block;margin-bottom:0.5rem;"></i>No positions match this filter.</div>`;
                    return;
                }
                jobsGrid.innerHTML = filtered.map(job => {
                    const isAvailable = job.available;
                    const badgeClass = isAvailable ? 'available' : 'unavailable';
                    const badgeText = isAvailable ? 'Available' : 'Unavailable';
                    const tasksHtml = job.tasks.map(t => `<li>${t}</li>`).join('');
                    const salaryHtml = isAvailable ? `<span class="job-salary">${job.salary} <span style="font-weight:400;color:var(--gray-500);font-size:0.7rem;">/ month</span></span>` : `<span class="job-salary"><span class="unavailable-text"><i class="fas fa-clock"></i> Currently unavailable</span></span>`;
                    const feeHtml = isAvailable ? `<span class="job-fee"><i class="fas fa-coins"></i> Fee: KES ${job.fee.toLocaleString()}</span>` : '';
                    const applyBtn = isAvailable ? `<button class="btn-apply" data-job-id="${job.id}"><i class="fas fa-hand-pointer"></i> Apply Now</button>` : `<button class="btn-apply" disabled style="background:var(--gray-300);"><i class="fas fa-lock"></i> Unavailable</button>`;
                    return `
                        <div class="job-card">
                            <div class="job-header"><span class="job-title">${job.title}</span><span class="job-badge ${badgeClass}">${badgeText}</span></div>
                            <ul class="job-tasks">${tasksHtml}</ul>
                            <div class="job-footer"><div>${salaryHtml}${feeHtml}</div>${applyBtn}</div>
                        </div>
                    `;
                }).join('');
                document.querySelectorAll('.btn-apply[data-job-id]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = parseInt(btn.dataset.jobId);
                        const job = JOBS.find(j => j.id === id);
                        if (job && job.available) {
                            if (localStorage.getItem('detailsFilled') !== 'true') {
                                showToast('Please fill in your personal details first.', 'error');
                                setTimeout(() => { window.location.href = 'details.html'; }, 1000);
                                return;
                            }
                            sessionStorage.setItem('selectedJob', JSON.stringify(job));
                            window.location.href = 'dash.html';
                        }
                    });
                });
            }

            // -------- FILTERS --------
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderJobs(currentFilter);
                });
            });

            // (renderJobs is called after the loading sequence completes)
        })();
    </script>
</body>
</html>
